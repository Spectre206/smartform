{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="text-center mb-4" style="color: var(--forest-green);">Login</h2>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="text-center">
                    <button type="submit" class="btn btn-forest">Login</button>
                </div>
            </form>
            <p class="text-center mt-3">
                Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
