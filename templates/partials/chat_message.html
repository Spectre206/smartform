<div class="message-row mb-3">
    <div class="d-flex justify-content-end">
        <div class="bg-primary text-white p-2 rounded mb-1" style="max-width:70%;">
            {{ user_message }}
        </div>
    </div>
    <div class="d-flex">
        <div class="bg-secondary text-white p-2 rounded" style="max-width:70%;">
            {{ assistant_reply }}
        </div>
    </div>
</div>

{% for error in errors %}
<div hx-swap-oob="true" id="error-{{ error.field }}">
    <div class="alert alert-danger p-2">{{ error.message }}</div>
</div>
{% endfor %}
