{% extends 'base.html' %}
{% block title %}Upload CNIC Image{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="text-center mb-4" style="color: var(--forest-green);">Upload CNIC Image</h2>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <p class="text-center">Application ID: {{ application.id }}</p>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="text-center">
                    <button type="submit" class="btn btn-forest">Upload & Extract</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
